<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ulasan Pelanggan</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .logo {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        h2 {
            color: #1a1a1a;
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        p {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .stars {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            direction: rtl; /* Untuk trik hover rating bintang */
        }

        .stars input {
            display: none;
        }

        .stars label {
            font-size: 2.5rem;
            color: #ddd;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .stars label:hover,
        .stars label:hover ~ label,
        .stars input:checked ~ label {
            color: #ffc107;
        }

        /* Halaman Terima Kasih & Lanjutan */
        .post-review-section {
            display: none;
            margin-top: 15px;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-action {
            display: block;
            width: 100%;
            padding: 12px 20px;
            margin-top: 10px;
            background-color: #0d6efd;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background-color 0.2s;
        }

        .btn-action:hover {
            background-color: #0b5ed7;
        }

        .btn-secondary {
            background-color: #198754;
        }

        .btn-secondary:hover {
            background-color: #157347;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo & Nama Bisnis -->
        <img src="https://via.placeholder.com/80" alt="Logo Usaha" class="logo">
        <h2>Bagaimana Pengalaman Anda?</h2>
        <p>Bantu kami meningkatkan kualitas layanan dengan memberikan penilaian di bawah ini:</p>

        <!-- Rating Bintang -->
        <div class="stars">
            <input type="radio" id="star5" name="rating" value="5" onclick="handleRating(5)">
            <label for="star5">★</label>
            
            <input type="radio" id="star4" name="rating" value="4" onclick="handleRating(4)">
            <label for="star4">★</label>
            
            <input type="radio" id="star3" name="rating" value="3" onclick="handleRating(3)">
            <label for="star3">★</label>
            
            <input type="radio" id="star2" name="rating" value="2" onclick="handleRating(2)">
            <label for="star2">★</label>
            
            <input type="radio" id="star1" name="rating" value="1" onclick="handleRating(1)">
            <label for="star1">★</label>
        </div>

        <!-- Section Setelah Ulasan Google (Bintang 4-5) -->
        <div id="postReview" class="post-review-section">
            <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
            <p>Terima kasih atas ulasan Anda! Sembari menunggu, yuk lihat menu atau informasi terbaru kami:</p>
            
            <a href="https://domain-usaha.com/menu" class="btn-action" target="_blank">📖 Lihat Daftar Menu</a>
            <a href="https://domain-usaha.com/company-profile" class="btn-action btn-secondary" target="_blank">🌐 Company Profile / Web</a>
        </div>
    </div>

    <script>
        // CONFIGURATION: SESUAIKAN DENGAN DATA CLIENT
        const CONFIG = {
            googleReviewUrl: "https://search.google.com/local/writereview?placeid=ChIJo6yn2euNaS4RxiU3uBxPt9s", // Link Google Review
            whatsappNumber: "6281234567890", // Nomor WA Admin (Format 62)
            businessName: "Kopi Kenangan Mantan" // Nama Usaha
        };

        function handleRating(stars) {
            if (stars >= 4) {
                // RATING 4 - 5: Arahkan ke Google Review
                
                // Tampilkan menu sekunder di halaman
                document.getElementById('postReview').style.display = 'block';
                
                // Buka Google Review di tab baru
                window.open(CONFIG.googleReviewUrl, '_blank');
                
            } else {
                // RATING 1 - 3: Arahkan ke WhatsApp
                const textMessage = `Halo Admin ${CONFIG.businessName}, saya ingin menyampaikan masukan/keluhan mengenai pelayanan. Penilaian saya: ${stars}/5 bintang.`;
                const encodedMessage = encodeURIComponent(textMessage);
                const waUrl = `https://wa.me/${CONFIG.whatsappNumber}?text=${encodedMessage}`;
                
                // Langsung arahkan ke WhatsApp
                window.location.href = waUrl;
            }
        }
    </script>
</body>
</html>
